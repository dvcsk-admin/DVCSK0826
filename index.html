                <!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Segítségnyújtó - Diszpécser Központ</title>
    
    <!-- Ingyenes térkép motor betöltése -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <!-- IDE JÖN MAJD A 2. RÉSZ (CSS) -->
<style>
    :root {
        --primary-color: #2c3e50;
        --secondary-color: #3498db;
        --success-color: #27ae60;
        --danger-color: #e74c3c;
        --bg-color: #f5f6fa;
        --panel-bg: #ffffff;
        --text-color: #2f3640;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--text-color);
    }

    header {
        background-color: var(--primary-color);
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .api-config {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .api-config input {
        padding: 6px 10px;
        border-radius: 4px;
        border: none;
        width: 180px;
        font-size: 0.85rem;
    }

    .main-container {
        display: flex;
        flex: 1;
        height: calc(100vh - 54px);
        overflow: hidden;
    }

    .incident-panel {
        width: 25%;
        background-color: var(--panel-bg);
        border-right: 1px solid #dcdde1;
        display: flex;
        flex-direction: column;
        padding: 15px;
        overflow-y: auto;
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: 2px solid var(--secondary-color);
        color: var(--primary-color);
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.9rem;
    }

    .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        color: white;
    }

    .btn-success { background-color: var(--success-color); }

    .incident-list {
        margin-top: 20px;
        flex: 1;
        overflow-y: auto;
    }

    .incident-item {
        background: #f8f9fa;
        border-left: 4px solid var(--secondary-color);
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        cursor: pointer;
        position: relative;
        font-size: 0.85rem;
    }

    .incident-item .delete-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background: none;
        border: none;
        color: var(--danger-color);
        cursor: pointer;
        font-weight: bold;
        font-size: 1.1rem;
    }

    .chat-panel {
        width: 35%;
        background-color: var(--panel-bg);
        border-right: 1px solid #dcdde1;
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        padding: 15px;
        font-weight: bold;
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }

    .chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #fdfdfd;
    }

    .message {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.4;
    }

    .message.assistant {
        background-color: #e8f4fd;
        color: var(--primary-color);
        align-self: flex-start;
    }

    .message.user {
        background-color: var(--secondary-color);
        color: white;
        align-self: flex-end;
    }

    .chat-input-area {
        padding: 12px;
        border-top: 1px solid #dee2e6;
        display: flex;
        gap: 8px;
        background: #f8f9fa;
    }

    .chat-input-area textarea {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: none;
        height: 38px;
    }

    .map-panel {
        width: 40%;
        height: 100%;
    }

    #map {
    width: 100%;
    height: 100%;
    min-height: 350px; /* Biztosítja, hogy mobilon se csukódjon össze 0 pixelre */
    background: #e0e0e0; /* Szürke háttér, amíg tölt a térkép */
}

    }

    @media (max-width: 1024px) {
        body { overflow-y: auto; height: auto; }
        .main-container { flex-direction: column; height: auto; }
        .incident-panel, .chat-panel, .map-panel { width: 100%; height: 450px; }
    }
</style>
    
</head>
<body>

    <header>
        <h2>Civil Segítségnyújtó — Vezérlő</h2>
        <div class="api-config">
            <label for="apiKey">API Kulcs:</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>
    </header>

    <div class="main-container">
        <!-- 1. KÁRESEMÉNY KEZELŐ -->
        <div class="incident-panel">
            <div class="panel-title">📍 Káresemény Rögzítése</div>
            <form id="incidentForm">
                <div class="form-group">
                    <label>Helyszín</label>
                    <input type="text" id="incLocation" required placeholder="Pl: Vác, Március 15. tér">
                </div>
                <div class="form-group">
                    <label>Esemény Típusa</label>
                    <select id="incType">
                        <option value="Vízár/Öntés">Vízár / Elöntés</option>
                        <option value="Vihar/Fakidőlés">Vihar / Fakidőlés</option>
                        <option value="Eltűnt személy">Eltűnt személy keresése</option>
                        <option value="Logisztikai segítség">Logisztikai segítség</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Részletek / Eszközök</label>
                    <textarea id="incDetails" rows="2" placeholder="Részletek..."></textarea>
                </div>
                <button type="submit" class="btn btn-success">Hozzáadás</button>
            </form>

            <div class="panel-title" style="margin-top: 25px;">📋 Aktív Események</div>
            <div class="incident-list" id="incidentList"></div>
        </div>
        
        <!-- 2. CHATGPT PANEL -->
        <div class="chat-panel">
            <div class="chat-header">🤖 ChatGPT Élő Asszisztens</div>
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    Üdvözlöm! Írja be felül az OpenAI kulcsát a valódi beszélgetéshez.
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="Kérdezz a ChatGPT-től..."></textarea>
                <button class="btn btn-success" id="sendChatBtn" style="width: auto; padding: 0 15px;">Küldés</button>
            </div>
        </div>

        <!-- 3. TÉRKÉP CONTÉNER -->
        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>

    <!-- IDE JÖN MAJD A 3. RÉSZ (JAVASCRIPT) -->
<script>
    let incidents = [];
    let map;
let currentMarker = null;

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('incidentForm').addEventListener('submit', addIncident);
    document.getElementById('sendChatBtn').addEventListener('click', sendToChatGPT);
    document.getElementById('chatInput').addEventListener('keypress', handleChatKeyPress);
    
    // Térkép elindítása
    map = L.map('map').setView([47.1625, 19.5033], 7);
    
    // Ingyenes OpenStreetMap csempék behívása
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Kifejezetten mobilokhoz: kényszerített méret-újraszámítás betöltés után
    setTimeout(() => {
        map.invalidateSize();
    }, 500);

    renderIncidents();
});

    function renderIncidents() {
        const listContainer = document.getElementById('incidentList');
        listContainer.innerHTML = '';
        if (incidents.length === 0) {
            listContainer.innerHTML = '<p style="color: #7f8c8d; font-style: italic; font-size:0.85rem;">Nincs aktív esemény.</p>';
            return;
        }
        incidents.forEach((inc, index) => {
            const div = document.createElement('div');
            div.className = 'incident-item';
            div.onclick = () => focusOnMap(inc.location);
            div.innerHTML = `
                <strong>[${inc.type}]</strong><br>
                <span>${inc.location}</span><br>
                <small style="color:#7f8c8d;">${inc.details}</small>
                <button class="delete-btn">×</button>
            `;
            div.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteIncident(index);
            });
            listContainer.appendChild(div);
        });
    }

    async function focusOnMap(address) {
        try {
            const response = await fetch(`https://openstreetmap.org{encodeURIComponent(address)}`);
            const data = await response.json();
            if (data && data.length > 0) {
                const lat = parseFloat(data.lat);
                const lon = parseFloat(data.lon);
                map.setView([lat, lon], 14);
                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Helyszín:</b><br>${address}`).openPopup();
            }
        } catch (error) {
            console.error(error);
        }
    }

    function addIncident(event) {
        event.preventDefault();
        const location = document.getElementById('incLocation').value;
        const type = document.getElementById('incType').value;
        const details = document.getElementById('incDetails').value;
        incidents.push({ location, type, details });
        document.getElementById('incidentForm').reset();
        renderIncidents();
        focusOnMap(location);
    }

    function deleteIncident(index) {
        if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
        incidents.splice(index, 1);
        renderIncidents();
    }

    async function sendToChatGPT() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const inputField = document.getElementById('chatInput');
        const promptText = inputField.value.trim();
        if (!promptText) return;

        appendMessage('user', promptText);
        inputField.value = '';
        if (!apiKey) { appendMessage('assistant', "⚠️ Hiba: Add meg az API kulcsot!"); return; }

        const loadingId = appendMessage('assistant', "<i>ChatGPT gondolkodik...</i>");

        try {
            const response = await fetch('https://openai.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [
                        { role: "system", content: "Te egy krízis-diszpécser vagy. Rövid válaszokat adj." },
                        { role: "user", content: promptText }
                    ]
                })
            });
            const data = await response.json();
            document.getElementById(loadingId).remove();
            if (data.choices) appendMessage('assistant', data.choices.message.content);
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('assistant', `❌ Hiba történt.`);
        }
    }

    function appendMessage(sender, text) {
        const chatMessages = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        const uniqueId = 'msg-' + Date.now();
        msgDiv.id = uniqueId;
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return uniqueId;
    }

    function handleChatKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendToChatGPT(); }
    }
                </script>
    
</body>
</html>
